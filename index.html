<title>M9 Specialty Café Menu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Bodoni+Moda:opsz,wght@6..96,400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: dark brand hero with logo and language switch, member-discount tiles, a sticky category and search bar, then one photo-row list per category. */
:root {
  --bg: #EDE5D9;
  --surface: #F8F3EB;
  --ink: #241810;
  --muted: #65564A;
  --line: #D6CABA;
  --chip: #E2D6C5;
  --accent: #F28A12;
  --accent-ink: #2A1A0A;
  --link: #9A4E08;
  --title-a: #A8651A;
  --title-b: #7A430C;
  --hero-bg: #24160D;
  --hero-ink: #F4ECDD;
  --hero-muted: #CDBBA3;
  --gold-a: #EFC378;
  --gold-b: #BE7F2F;
  --f-display: 'Bodoni Moda', 'Didot', Georgia, serif;
  --f-body: 'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-ar-display: 'Amiri', 'Noto Naskh Arabic', 'Times New Roman', serif;
  --f-ar-body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --bar-h: 120px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #170F0A; --surface: #221711; --ink: #F3EADC; --muted: #BBAA97; --line: #38291D;
    --chip: #34251A; --accent: #F7A23A; --accent-ink: #2A1A0A; --link: #F2B466;
    --title-a: #F3C77F; --title-b: #CC8E3E; --hero-bg: #2A1A10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #170F0A; --surface: #221711; --ink: #F3EADC; --muted: #BBAA97; --line: #38291D;
  --chip: #34251A; --accent: #F7A23A; --accent-ink: #2A1A0A; --link: #F2B466;
  --title-a: #F3C77F; --title-b: #CC8E3E; --hero-bg: #2A1A10;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
}
:root[lang="ar"] body { font-family: var(--f-ar-body); }
[lang="ar"] { font-family: var(--f-ar-body); }
[lang="en"] { font-family: var(--f-body); }
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 1120px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, summary { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Hero */
.hero { background: radial-gradient(120% 140% at 88% -10%, #5B3B22 0%, var(--hero-bg) 52%, #1B110A 100%); color: var(--hero-ink); }
.hero-in { padding-block: 22px 26px; display: grid; gap: 22px; }
.hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.logo { height: 88px; width: auto; max-width: 40vw; display: block; }
.lang { display: inline-flex; border: 1px solid rgba(244, 236, 221, .35); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: .9rem; color: var(--hero-ink); min-height: 36px; }
.lang button[aria-pressed="true"] { background: var(--hero-ink); color: #24160D; font-weight: 600; }
.lang button:focus-visible { outline-color: var(--gold-a); }
.hero h1 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: clamp(3rem, 12vw, 5.5rem); line-height: 1; letter-spacing: -.01em; text-wrap: balance; color: var(--gold-a); }
:root[lang="ar"] .hero h1 { font-family: var(--f-ar-display); font-weight: 700; line-height: 1.25; }
.hero-meta { margin: 8px 0 0; color: var(--hero-muted); font-size: .95rem; letter-spacing: .02em; }
@supports (-webkit-background-clip: text) or (background-clip: text) {
  .gold { background: linear-gradient(180deg, var(--gold-a) 20%, var(--gold-b)); -webkit-background-clip: text; background-clip: text; color: transparent !important; }
}

/* Discounts */
.disc { padding-block: 26px 8px; }
.eyebrow { margin: 0 0 12px; font-size: .78rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--link); }
:root[lang="ar"] .eyebrow { letter-spacing: 0; font-size: .9rem; }
.disc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.tile-name { margin: 0; font-size: 1.05rem; font-weight: 600; line-height: 1.25; }
.tile-alt { margin: 0; color: var(--muted); font-size: .95rem; }
.tile-offer { margin: 6px 0 0; font-size: .92rem; }
.tile-pct { font-family: var(--f-display); font-size: 2rem; line-height: 1; color: var(--link); margin: 6px 0 0; }
.tile a { color: var(--link); font-size: .9rem; overflow-wrap: anywhere; }
.disc-note { margin: 12px 0 0; color: var(--muted); font-size: .92rem; }

/* Sticky bar */
.tools { padding-block: 22px 8px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); margin-top: 10px; }
.bar-in { padding-block: 10px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; white-space: nowrap; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 16px; cursor: pointer; font-weight: 500; min-height: 40px; }
.tabs button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.search { max-width: 520px; min-width: 0; }
.search input { width: 100%; min-height: 40px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; }
.search input::placeholder { color: var(--muted); }

/* Allergen filter */
.avoid { margin-top: 12px; }
.avoid summary { cursor: pointer; font-weight: 500; padding-block: 6px; width: fit-content; }
.avoid-body { padding-block: 6px 2px; display: grid; gap: 10px; }
.avoid-help { margin: 0; color: var(--muted); font-size: .92rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; min-height: 36px; font-size: .92rem; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Sections */
.cat { padding-top: 34px; scroll-margin-top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) - 18px); }
.cat-head { display: flex; align-items: center; gap: 18px; margin-bottom: 8px; min-width: 0; }
.cat-img { width: clamp(110px, 26vw, 200px); aspect-ratio: 4 / 3; object-fit: cover; border-radius: 14px; flex: none; }
.cat-head h2 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: clamp(2rem, 7vw, 3.25rem); line-height: 1.05; letter-spacing: -.01em; text-wrap: balance; color: var(--title-a); min-width: 0; }
:root[lang="ar"] .cat-head h2 { font-family: var(--f-ar-display); font-weight: 700; line-height: 1.3; }
.cat-count { margin: 6px 0 0; color: var(--muted); font-size: .92rem; }
.cat-title { min-width: 0; }
@supports (-webkit-background-clip: text) or (background-clip: text) {
  .cat-head h2 { background: linear-gradient(180deg, var(--title-a), var(--title-b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
}
.list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); column-gap: 28px; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: start; padding-block: 14px; border-bottom: 1px solid var(--line); }
.thumb { width: clamp(92px, 27vw, 128px); aspect-ratio: 3 / 2; object-fit: cover; border-radius: 10px; background: var(--chip); display: block; }
.name { margin: 0; font-size: 1.08rem; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
.alt { margin: 1px 0 0; color: var(--muted); font-size: .92rem; line-height: 1.35; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 0; padding: 0; list-style: none; }
.tags li { font-size: .75rem; line-height: 1.2; padding: 3px 9px; border-radius: 999px; background: var(--chip); }
.tags li.none { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.price { text-align: end; white-space: nowrap; }
.num { font-size: 1.3rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.cur { display: block; font-size: .72rem; letter-spacing: .08em; color: var(--muted); }
:root[lang="ar"] .cur { letter-spacing: 0; font-size: .8rem; }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }
.empty button { margin-top: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 18px; cursor: pointer; min-height: 40px; }
.foot { padding-block: 36px 48px; color: var(--muted); font-size: .92rem; display: grid; gap: 6px; max-width: 70ch; }
.foot p { margin: 0; }
[hidden] { display: none !important; }
@media (max-width: 420px) {
  .logo { height: 72px; }
  .item { gap: 12px; }
  .cat-head { gap: 14px; }
}
</style>

/* ===== App ===== */
var KEY = 'm9-lang';
var lang = 'en';
try {
  var saved = localStorage.getItem(KEY);
  if (saved === 'ar' || saved === 'en') lang = saved;
  else if ((navigator.language || '').toLowerCase().indexOf('ar') === 0) lang = 'ar';
} catch (e) {
  if ((navigator.language || '').toLowerCase().indexOf('ar') === 0) lang = 'ar';
}
var avoidSet = {};
var query = '';
var $ = function (id) { return document.getElementById(id); };
var other = function (l) { return l === 'ar' ? 'en' : 'ar'; };
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function norm(s) { return String(s).toLowerCase().replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي'); }

function usedAllergens() {
  var seen = {}, out = [];
  Object.keys(ALLERGENS).forEach(function (k) {
    if (ITEMS.some(function (it) { return it.a.indexOf(k) > -1; })) out.push(k);
  });
  return out;
}

function matches(it) {
  var hit = Object.keys(avoidSet).some(function (k) { return avoidSet[k] && it.a.indexOf(k) > -1; });
  if (hit) return false;
  if (!query) return true;
  var q = norm(query.trim());
  return norm(it.en).indexOf(q) > -1 || norm(it.ar).indexOf(q) > -1;
}

function renderStatic() {
  var t = T[lang];
  var root = document.documentElement;
  root.lang = lang;
  root.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $('h1').textContent = t.title;
  $('h1').setAttribute('lang', lang);
  $('meta').textContent = ITEMS.length + ' ' + (lang === 'ar' ? 'صنفًا' : 'items') + ' · ' + (lang === 'ar' ? 'الأسعار بالدرهم' : 'Prices in AED');
  $('disc-h').textContent = t.discH;
  $('disc-note').textContent = t.discNote;
  $('q').placeholder = t.search;
  $('q-label').textContent = t.search;
  $('avoid-sum').textContent = t.avoid;
  $('avoid-help').textContent = t.avoidHelp;
  $('empty-text').textContent = t.empty;
  $('clear').textContent = t.clear;
  $('foot-allergen').textContent = t.footA;
  $('foot-price').textContent = t.footP;
  $('tabs').setAttribute('aria-label', t.tabs);
  document.title = lang === 'ar' ? 'قائمة إم 9 سبيشالتي كافيه' : 'M9 Specialty Café Menu';
  Array.prototype.forEach.call(document.querySelectorAll('.lang button'), function (b) {
    b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang));
  });

  $('disc').innerHTML = DISCOUNTS.map(function (d) {
    var offerHtml = d.offer ? '<p class="tile-offer">' + esc(d.offer[lang]) + '</p>' : '';
    var pct = d.percent ? '<p class="tile-pct">' + esc(d.percent) + '%</p>' : '';
    var link = d.link ? '<a href="' + esc(d.link) + '" target="_blank" rel="noopener noreferrer" lang="en" dir="ltr">' + esc(d.link.replace(/^https?:\/\//, '').replace(/\/$/, '')) + '</a>' : '';
    return '<article class="tile"><h3 class="tile-name" lang="' + lang + '">' + esc(d[lang]) + '</h3>' +
      '<p class="tile-alt" lang="' + other(lang) + '">' + esc(d[other(lang)]) + '</p>' + pct +
      offerHtml + link + '</article>';
  }).join('');

  $('tabs').innerHTML = CATS.map(function (c) {
    return '<button type="button" data-cat="' + c.id + '">' + esc(lang === 'ar' ? c.tabAr : c.tabEn) + '</button>';
  }).join('');

  $('chips').innerHTML = usedAllergens().map(function (k) {
    return '<li><button type="button" data-allergen="' + k + '" aria-pressed="' + (!!avoidSet[k]) + '">' + esc(ALLERGENS[k][lang]) + '</button></li>';
  }).join('');
}

function itemHtml(it) {
  var t = T[lang];
  var tags = it.a.length
    ? it.a.map(function (k) { return '<li>' + esc(ALLERGENS[k][lang]) + '</li>'; }).join('')
    : '<li class="none">' + esc(t.none) + '</li>';
  return '<li class="item"><img class="thumb" loading="lazy" decoding="async" alt="' + esc(it[lang]) + '" src="' + IMG['p' + (it.page < 10 ? '0' : '') + it.page] + '">' +
    '<div><h3 class="name" lang="' + lang + '">' + esc(it[lang]) + '</h3>' +
    '<p class="alt" lang="' + other(lang) + '">' + esc(it[other(lang)]) + '</p>' +
    '<ul class="tags" aria-label="' + (lang === 'ar' ? 'مسببات الحساسية' : 'Allergens') + '">' + tags + '</ul></div>' +
    '<div class="price"><span class="num">' + it.price + '</span><span class="cur">' + esc(t.cur) + '</span></div></li>';
}

function renderSections() {
  var t = T[lang], any = false;
  $('sections').innerHTML = CATS.map(function (c) {
    var all = ITEMS.filter(function (it) { return it.cat === c.id; });
    var shown = all.filter(matches);
    if (shown.length) any = true;
    return '<section class="cat" id="sec-' + c.id + '" aria-labelledby="h-' + c.id + '"' + (shown.length ? '' : ' hidden') + '>' +
      '<div class="cat-head"><img class="cat-img" alt="" src="' + IMG[c.img] + '">' +
      '<div class="cat-title"><h2 id="h-' + c.id + '" lang="' + lang + '">' + esc(c[lang]) + '</h2>' +
      '<p class="cat-count">' + esc(t.items(shown.length)) + '</p></div></div>' +
      '<ul class="list">' + shown.map(itemHtml).join('') + '</ul></section>';
  }).join('');
  $('empty').hidden = any;
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
    var sec = $('sec-' + b.getAttribute('data-cat'));
    b.hidden = !sec || sec.hidden;
  });
  measure();
  spy();
}

function measure() {
  document.documentElement.style.setProperty('--bar-h', $('bar').offsetHeight + 'px');
}

var lastCur = null;
function spy() {
  var line = $('bar').getBoundingClientRect().bottom + 24, cur = null, first = null;
  CATS.forEach(function (c) {
    var s = $('sec-' + c.id);
    if (!s || s.hidden) return;
    if (!first) first = c.id;
    if (s.getBoundingClientRect().top <= line) cur = c.id;
  });
  cur = cur || first;
  var curBtn = null;
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
    var on = b.getAttribute('data-cat') === cur;
    b.setAttribute('aria-current', String(on));
    if (on) curBtn = b;
  });
  if (curBtn && cur !== lastCur) {
    lastCur = cur;
    var tabs = $('tabs'), tr = tabs.getBoundingClientRect(), br = curBtn.getBoundingClientRect();
    tabs.scrollBy({ left: (br.left + br.width / 2) - (tr.left + tr.width / 2), behavior: 'auto' });
  }
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem(KEY, l); } catch (e) {}
  lastCur = null;
  renderStatic();
  renderSections();
}

document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('button') : null;
  if (!el) return;
  if (el.hasAttribute('data-lang')) { setLang(el.getAttribute('data-lang')); return; }
  if (el.hasAttribute('data-cat')) {
    var s = $('sec-' + el.getAttribute('data-cat'));
    if (s) {
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      s.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    }
    return;
  }
  if (el.hasAttribute('data-allergen')) {
    var k = el.getAttribute('data-allergen');
    avoidSet[k] = !avoidSet[k];
    el.setAttribute('aria-pressed', String(!!avoidSet[k]));
    renderSections();
    return;
  }
  if (el.id === 'clear') {
    avoidSet = {}; query = ''; $('q').value = '';
    renderStatic(); renderSections();
  }
});
$('q').addEventListener('input', function (e) { query = e.target.value; renderSections(); });
window.addEventListener('scroll', function () { window.requestAnimationFrame(spy); }, { passive: true });
window.addEventListener('resize', function () { measure(); spy(); });

renderStatic();
renderSections();
</script>

</body></html>
